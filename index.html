<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daml Access Graph</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Daml Access Graph</h1>
      <p class="subtitle">
        Prototype visualizer of the access structure of Daml templates —
        signatories, observers, choices, controllers, and ledger operations.
        <strong>Heuristic parser: results are best-effort, not sound.</strong>
      </p>
    </header>

    <main class="layout">
      <section class="pane pane-input">
        <div class="pane-toolbar">
          <label for="examples">Example:</label>
          <select id="examples"></select>
          <button id="analyze" type="button">Analyze ▶</button>
          <button id="load-json" type="button" class="btn-secondary" title="Load a normalized graph JSON produced by the Daml-LF backend (backend/extract-dar.js)">Load graph JSON</button>
          <input id="json-file" type="file" accept=".json,application/json" hidden />
        </div>
        <textarea
          id="source"
          spellcheck="false"
          placeholder="Paste Daml source here…"
        ></textarea>
      </section>

      <section class="pane pane-graph">
        <div class="pane-toolbar">
          <span id="stats" class="stats"></span>
          <span id="legend" class="legend"></span>
        </div>
        <svg id="graph" width="100%" height="100%"></svg>
      </section>
    </main>

    <section class="pane pane-output">
      <div class="output-cols">
        <div class="output-col">
          <h2>Parse diagnostics</h2>
          <ul id="diagnostics" class="diagnostics"></ul>
        </div>
        <div class="output-col">
          <h2>Static analysis</h2>
          <ul id="findings" class="diagnostics"></ul>
        </div>
        <div class="output-col">
          <h2>Normalized graph JSON</h2>
          <pre id="json" class="json"></pre>
        </div>
      </div>
    </section>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
